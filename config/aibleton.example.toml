[bridge]
# Host/port of AbletonOSC or compatible Remote Script.
host = "127.0.0.1"
port = 11000
# Optional UDP port to bind for AbletonOSC replies. Omit or set to 0 to use an ephemeral port.
# listen_port = 11002

# Set to true to emit UDP packets. Leave false for dry-run logging.
send = false

# Seconds before UDP send times out.
timeout = 1.0
