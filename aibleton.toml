[bridge]
# Host/port of AbletonOSC or compatible Remote Script.
host = "127.0.0.1"
port = 11000
# Local UDP port that receives AbletonOSC replies (defaults to 11001).
listen_port = 11001

# Set to true to emit UDP packets. Leave false for dry-run logging.
send = true

# Seconds before UDP send times out.
timeout = 1.0
